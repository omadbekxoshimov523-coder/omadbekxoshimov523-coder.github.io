<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Xoshimov Omadbek</title>
<meta name="robots" content="noindex">
<style>
  /* Self-contained 404 so it never depends on the site's assets. */
  :root{ --bg:#05070d; --gold:#d9b46a; --cream:#f3efe6; --muted:#9aa4b2; }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
    background:var(--bg);color:var(--cream);padding:24px;
    font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  .wrap{max-width:46ch}
  h1{
    font-family:Syne,system-ui,sans-serif;font-weight:800;letter-spacing:-.03em;
    font-size:clamp(4rem,20vw,9rem);line-height:.9;margin:0;
    background:linear-gradient(135deg,#8fb4d9,#d9b46a);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p{color:var(--muted);margin:18px 0 30px}
  a{
    display:inline-block;padding:14px 28px;border-radius:999px;
    background:var(--gold);color:#14100a;font-weight:700;text-decoration:none;
    transition:transform .25s ease,background .25s ease;
  }
  a:hover{transform:translateY(-2px);background:#e6c583}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>This page does not exist — but the portfolio does. Head back home.</p>
    <a href="/">Back to the portfolio</a>
  </div>
</body>
</html>
