<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Nova Studio CMS — editorial content grid with a publish action">
  <title>Nova Studio CMS — editorial content grid</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.05" r="1">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="#07070b"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <rect x="40" y="40" width="1120" height="670" rx="22" fill="#0C0C15" stroke="#ffffff" stroke-opacity="0.10"/>
  <path d="M40 62a22 22 0 0 1 22-22h1076a22 22 0 0 1 22 22v24H40z" fill="#ffffff" opacity="0.035"/>
  <circle cx="72" cy="63" r="6" fill="#FF5F57"/><circle cx="94" cy="63" r="6" fill="#FEBC2E"/><circle cx="116" cy="63" r="6" fill="#28C840"/>
  <rect x="150" y="57" width="170" height="12" rx="6" fill="#ffffff" opacity="0.13"/>

  <!-- page heading -->
  <rect x="96" y="140" width="392" height="20" rx="10" fill="#ffffff" opacity="0.34"/>
  <rect x="96" y="184" width="300" height="11" rx="5.5" fill="#ffffff" opacity="0.15"/>
  <rect x="96" y="210" width="360" height="11" rx="5.5" fill="#ffffff" opacity="0.15"/>
  <rect x="96" y="236" width="220" height="11" rx="5.5" fill="#ffffff" opacity="0.15"/>
  <rect x="836" y="140" width="260" height="50" rx="25" fill="url(#accent)"/>
  <path d="M884 158v14M877 165h14" stroke="#3B1D02" stroke-width="2.5" stroke-linecap="round"/>
  <text x="984" y="171" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#3B1D02">New entry</text>

  <!-- filter pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14">
    <rect x="96" y="284" width="96" height="34" rx="17" fill="url(#accent)" opacity="0.9"/>
    <text x="144" y="306" text-anchor="middle" fill="#3B1D02" font-weight="600">All</text>
    <rect x="204" y="284" width="112" height="34" rx="17" fill="#ffffff" opacity="0.06"/>
    <text x="260" y="306" text-anchor="middle" fill="#94A3B8">Published</text>
    <rect x="328" y="284" width="96" height="34" rx="17" fill="#ffffff" opacity="0.06"/>
    <text x="376" y="306" text-anchor="middle" fill="#94A3B8">Drafts</text>
  </g>

  <!-- card grid -->
  <g>
    <rect x="96" y="344" width="304" height="166" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="112" y="360" width="140" height="82" rx="10" fill="url(#accent)" opacity="0.85"/>
    <rect x="112" y="458" width="150" height="10" rx="5" fill="#ffffff" opacity="0.32"/>
    <rect x="112" y="480" width="100" height="8" rx="4" fill="#ffffff" opacity="0.16"/>

    <rect x="424" y="344" width="304" height="166" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="440" y="360" width="140" height="82" rx="10" fill="url(#accent)" opacity="0.62"/>
    <rect x="440" y="458" width="176" height="10" rx="5" fill="#ffffff" opacity="0.32"/>
    <rect x="440" y="480" width="120" height="8" rx="4" fill="#ffffff" opacity="0.16"/>

    <rect x="752" y="344" width="304" height="166" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="768" y="360" width="140" height="82" rx="10" fill="url(#accent)" opacity="0.42"/>
    <rect x="768" y="458" width="128" height="10" rx="5" fill="#ffffff" opacity="0.32"/>
    <rect x="768" y="480" width="140" height="8" rx="4" fill="#ffffff" opacity="0.16"/>

    <rect x="96" y="534" width="304" height="166" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="112" y="550" width="140" height="82" rx="10" fill="url(#accent)" opacity="0.72"/>
    <rect x="112" y="648" width="196" height="10" rx="5" fill="#ffffff" opacity="0.32"/>
    <rect x="112" y="670" width="110" height="8" rx="4" fill="#ffffff" opacity="0.16"/>

    <rect x="424" y="534" width="304" height="166" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="440" y="550" width="140" height="82" rx="10" fill="url(#accent)" opacity="0.52"/>
    <rect x="440" y="648" width="162" height="10" rx="5" fill="#ffffff" opacity="0.32"/>
    <rect x="440" y="670" width="126" height="8" rx="4" fill="#ffffff" opacity="0.16"/>

    <rect x="752" y="534" width="304" height="166" rx="14" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="8 8"/>
    <path d="M904 596v40M884 616h40" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- status chips -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12">
    <rect x="368" y="372" width="66" height="22" rx="11" fill="#34D399" opacity="0.18"/>
    <text x="401" y="387" text-anchor="middle" fill="#6EE7B7">Live</text>
    <rect x="696" y="372" width="66" height="22" rx="11" fill="#34D399" opacity="0.18"/>
    <text x="729" y="387" text-anchor="middle" fill="#6EE7B7">Live</text>
    <rect x="1024" y="372" width="66" height="22" rx="11" fill="#FBBF24" opacity="0.18"/>
    <text x="1057" y="387" text-anchor="middle" fill="#FCD34D">Draft</text>
  </g>
</svg>