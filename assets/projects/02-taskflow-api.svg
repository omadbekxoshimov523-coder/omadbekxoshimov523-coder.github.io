<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="TaskFlow API — Express route, JSON response and Docker deployment log">
  <title>TaskFlow API — REST service with Docker deployment</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.05" r="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="#07070b"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <rect x="40" y="40" width="1120" height="670" rx="22" fill="#0C0C15" stroke="#ffffff" stroke-opacity="0.10"/>
  <path d="M40 62a22 22 0 0 1 22-22h1076a22 22 0 0 1 22 22v24H40z" fill="#ffffff" opacity="0.035"/>
  <circle cx="72" cy="63" r="6" fill="#FF5F57"/><circle cx="94" cy="63" r="6" fill="#FEBC2E"/><circle cx="116" cy="63" r="6" fill="#28C840"/>
  <rect x="150" y="57" width="200" height="12" rx="6" fill="#ffffff" opacity="0.13"/>

  <!-- source code panel -->
  <rect x="64" y="112" width="524" height="574" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="88" y="136" width="96" height="9" rx="4.5" fill="#ffffff" opacity="0.24"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="88" y="186" fill="#C084FC">export</text>
    <text x="146" y="186" fill="#E2E8F0">async function</text>
    <text x="300" y="186" fill="#7DD3FC">createTask</text><text x="392" y="186" fill="#E2E8F0">(req, res) {</text>
    <text x="112" y="216" fill="#64748B">// validate · persist · respond</text>
    <text x="112" y="246" fill="#E2E8F0"><tspan fill="#7DD3FC">const</tspan> schema =</text>
    <text x="136" y="276" fill="#FDE68A">TaskSchema.parse</text><text x="288" y="276" fill="#E2E8F0">(req.body);</text>
    <text x="112" y="306" fill="#E2E8F0"><tspan fill="#7DD3FC">const</tspan> task =</text>
    <text x="136" y="336" fill="#E2E8F0"><tspan fill="#7DD3FC">await</tspan> repo.save(schema);</text>
    <text x="112" y="366" fill="#E2E8F0"><tspan fill="#7DD3FC">if</tspan> (!auth.ok) {</text>
    <text x="136" y="396" fill="#F472B6">throw new HttpError</text><text x="284" y="396" fill="#E2E8F0">(401);</text>
    <text x="112" y="426" fill="#E2E8F0">}</text>
    <text x="112" y="456" fill="#E2E8F0"><tspan fill="#7DD3FC">return</tspan> res.status(201)</text>
    <text x="136" y="486" fill="#E2E8F0">.json({ ok: <tspan fill="#A5F3FC">true</tspan> });</text>
    <text x="88" y="516" fill="#E2E8F0">}</text>
  </g>
  <rect x="88" y="546" width="120" height="26" rx="13" fill="url(#accent)" opacity="0.9"/>
  <text x="148" y="564" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#07070b">POST /tasks</text>
  <rect x="220" y="546" width="112" height="26" rx="13" fill="#ffffff" opacity="0.08"/>
  <text x="276" y="564" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">JWT bearer</text>
  <rect x="88" y="600" width="476" height="1" fill="#ffffff" opacity="0.07"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748B">
    <text x="88" y="634">zod · prisma · argon2 · helmet · pino</text>
    <text x="88" y="662">rate-limit · swagger · vitest</text>
  </g>

  <!-- response panel -->
  <rect x="612" y="112" width="524" height="318" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="640" cy="140" r="6" fill="#34D399"/>
  <text x="658" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#34D399">201 Created</text>
  <rect x="760" y="130" width="104" height="20" rx="10" fill="#ffffff" opacity="0.07"/>
  <text x="812" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#94A3B8">124 ms</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A5F3FC">
    <text x="640" y="186">{</text>
    <text x="664" y="212">"ok": <tspan fill="#FDE68A">true</tspan>,</text>
    <text x="664" y="238">"task": {</text>
    <text x="688" y="264">"id": <tspan fill="#C4B5FD">"tsk_9f2ac1"</tspan>,</text>
    <text x="688" y="290">"title": <tspan fill="#C4B5FD">"Ship it"</tspan>,</text>
    <text x="688" y="316">"status": <tspan fill="#C4B5FD">"done"</tspan>,</text>
    <text x="688" y="342">"owner": <tspan fill="#C4B5FD">"omadbek"</tspan></text>
    <text x="664" y="368">},</text>
    <text x="664" y="394">"createdAt": <tspan fill="#C4B5FD">"2026-02-11"</tspan></text>
  </g>

  <!-- terminal / docker panel -->
  <rect x="612" y="454" width="524" height="232" rx="14" fill="#000000" opacity="0.32" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="640" y="492" fill="#4ADE80">$ docker compose up -d --build</text>
    <text x="640" y="524" fill="#94A3B8">[+] Running 4/4</text>
    <text x="640" y="552" fill="#94A3B8"> ✔ api        healthy   0.9s</text>
    <text x="640" y="580" fill="#94A3B8"> ✔ postgres   healthy   1.4s</text>
    <text x="640" y="608" fill="#94A3B8"> ✔ redis      healthy   0.6s</text>
    <text x="640" y="636" fill="#4ADE80">✔ migrations applied  ·  7 tables</text>
    <rect x="640" y="654" width="10" height="16" fill="url(#accent)"/>
  </g>
</svg>