<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="UzMarket Bot — Telegram sales conversation with product cards">
  <title>UzMarket Bot — Telegram commerce bot</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.04" r="1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="#07070b"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect width="1200" height="750" fill="url(#weave)"/>

  <rect x="40" y="40" width="1120" height="670" rx="22" fill="#0C0C15" stroke="#ffffff" stroke-opacity="0.10"/>
  <path d="M40 62a22 22 0 0 1 22-22h1076a22 22 0 0 1 22 22v24H40z" fill="#ffffff" opacity="0.035"/>
  <circle cx="72" cy="63" r="6" fill="#FF5F57"/><circle cx="94" cy="63" r="6" fill="#FEBC2E"/><circle cx="116" cy="63" r="6" fill="#28C840"/>
  <rect x="150" y="57" width="200" height="12" rx="6" fill="#ffffff" opacity="0.13"/>

  <!-- bot identity -->
  <circle cx="600" cy="140" r="34" fill="url(#accent)"/>
  <path d="M600 118c-11 0-20 9-20 20 0 8 5 15 12 18v8h16v-8c7-3 12-10 12-18 0-11-9-20-20-20z" fill="#07070b" opacity="0.85"/>
  <circle cx="592" cy="136" r="3.5" fill="#34D399"/><circle cx="608" cy="136" r="3.5" fill="#34D399"/>
  <rect x="510" y="112" width="110" height="26" rx="13" fill="url(#accent)" opacity="0.85"/>
  <text x="565" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#07070b">ONLINE</text>
  <text x="628" y="132" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="#E2E8F0">UzMarket Bot</text>
  <text x="628" y="156" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">@uzmarket_sales</text>

  <!-- inbound -->
  <g>
    <rect x="656" y="186" width="440" height="92" rx="20" fill="url(#accent)"/>
    <text x="686" y="222" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#06251B">Salom! Buyurtmangizni</text>
    <text x="686" y="250" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#06251B">yozing — katalog ko&#39;rsataman</text>
  </g>
  <g opacity="0.9">
    <rect x="120" y="298" width="330" height="58" rx="20" fill="#ffffff" opacity="0.09"/>
    <text x="150" y="334" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#E2E8F0">2 ta kurtka, 46–48 raqam</text>
  </g>

  <!-- product cards -->
  <g>
    <rect x="656" y="376" width="440" height="112" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="672" y="392" width="80" height="80" rx="14" fill="url(#accent)" opacity="0.85"/>
    <rect x="768" y="404" width="130" height="11" rx="5.5" fill="#ffffff" opacity="0.38"/>
    <rect x="768" y="428" width="200" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
    <rect x="768" y="452" width="84" height="20" rx="10" fill="url(#accent)"/>
    <rect x="862" y="452" width="70" height="20" rx="10" fill="#ffffff" opacity="0.08"/>
  </g>
  <g>
    <rect x="656" y="504" width="440" height="112" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="672" y="520" width="80" height="80" rx="14" fill="url(#accent)" opacity="0.55"/>
    <rect x="768" y="532" width="150" height="11" rx="5.5" fill="#ffffff" opacity="0.38"/>
    <rect x="768" y="556" width="180" height="9" rx="4.5" fill="#ffffff" opacity="0.16"/>
    <rect x="768" y="580" width="84" height="20" rx="10" fill="url(#accent)" opacity="0.8"/>
    <rect x="862" y="580" width="70" height="20" rx="10" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- composer -->
  <rect x="120" y="640" width="880" height="46" rx="23" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="148" y="669" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#64748B">Xabar yozing…</text>
  <circle cx="962" cy="663" r="17" fill="url(#accent)"/>
  <path d="M956 663h12m-5-5 5 5-5 5" stroke="#06251B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">
    <rect x="1024" y="626" width="112" height="34" rx="17" fill="#ffffff" opacity="0.05"/>
    <text x="1080" y="648" text-anchor="middle">Click / Payme</text>
  </g>
</svg>