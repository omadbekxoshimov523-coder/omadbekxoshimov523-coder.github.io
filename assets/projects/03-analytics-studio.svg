<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Analytics Studio — conversion donut and trend sparklines">
  <title>Analytics Studio — reporting dashboard</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.04" r="1">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="#07070b"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <rect x="40" y="40" width="1120" height="670" rx="22" fill="#0C0C15" stroke="#ffffff" stroke-opacity="0.10"/>
  <path d="M40 62a22 22 0 0 1 22-22h1076a22 22 0 0 1 22 22v24H40z" fill="#ffffff" opacity="0.035"/>
  <circle cx="72" cy="63" r="6" fill="#FF5F57"/><circle cx="94" cy="63" r="6" fill="#FEBC2E"/><circle cx="116" cy="63" r="6" fill="#28C840"/>
  <rect x="150" y="57" width="190" height="12" rx="6" fill="#ffffff" opacity="0.13"/>

  <!-- metric strip -->
  <rect x="64" y="112" width="1072" height="128" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <g>
    <rect x="92" y="138" width="70" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
    <rect x="92" y="164" width="120" height="26" rx="8" fill="url(#accent)"/>
    <polyline points="232,186 254,176 276,180 298,164 320,170 342,154" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle cx="342" cy="154" r="5" fill="#F472B6"/>

    <rect x="420" y="138" width="84" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
    <rect x="420" y="164" width="96" height="26" rx="8" fill="url(#accent)" opacity="0.7"/>
    <polyline points="540,182 562,168 584,176 606,158 628,166 650,150" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="650" cy="150" r="5" fill="#C084FC"/>

    <rect x="728" y="138" width="62" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
    <rect x="728" y="164" width="134" height="26" rx="8" fill="url(#accent)" opacity="0.5"/>
    <polyline points="884,178 906,186 928,172 950,164 972,158 994,146" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <circle cx="994" cy="146" r="5" fill="#8B5CF6"/>

    <rect x="1020" y="140" width="92" height="34" rx="17" fill="#ffffff" opacity="0.07"/>
    <text x="1066" y="163" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">30 days ▾</text>
  </g>

  <!-- donut -->
  <rect x="64" y="264" width="620" height="422" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="92" y="292" width="104" height="9" rx="4.5" fill="#ffffff" opacity="0.26"/>
  <circle cx="374" cy="484" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="30"/>
  <circle cx="374" cy="484" r="120" fill="none" stroke="url(#accent)" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="581 754" transform="rotate(-90 374 484)"/>
  <circle cx="374" cy="484" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="18"/>
  <circle cx="374" cy="484" r="76" fill="none" stroke="#22D3EE" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="300 478" opacity="0.75" transform="rotate(-90 374 484)"/>
  <text x="374" y="478" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#F1F5F9">77%</text>
  <text x="374" y="508" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94A3B8">conversion rate</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="15">
    <circle cx="96" cy="580" r="6" fill="#8B5CF6"/><text x="112" y="586" fill="#CBD5E1">Checkout</text>
    <circle cx="216" cy="580" r="6" fill="#22D3EE"/><text x="232" y="586" fill="#CBD5E1">Product</text>
    <circle cx="330" cy="580" r="6" fill="#F472B6"/><text x="346" y="586" fill="#CBD5E1">Signup</text>
  </g>

  <!-- funnel bars -->
  <rect x="708" y="264" width="428" height="422" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="736" y="292" width="112" height="9" rx="4.5" fill="#ffffff" opacity="0.26"/>
  <g>
    <rect x="736" y="326" width="372" height="34" rx="10" fill="url(#accent)"/>
    <rect x="736" y="374" width="306" height="34" rx="10" fill="url(#accent)" opacity="0.82"/>
    <rect x="736" y="422" width="244" height="34" rx="10" fill="url(#accent)" opacity="0.64"/>
    <rect x="736" y="470" width="176" height="34" rx="10" fill="url(#accent)" opacity="0.46"/>
    <rect x="736" y="518" width="118" height="34" rx="10" fill="url(#accent)" opacity="0.3"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">
    <text x="752" y="349">Visitors</text>
    <text x="752" y="397">Product view</text>
    <text x="752" y="445">Add to cart</text>
    <text x="752" y="493">Checkout</text>
    <text x="752" y="541">Purchase</text>
  </g>
  <rect x="736" y="592" width="200" height="40" rx="20" fill="#ffffff" opacity="0.05"/>
  <text x="836" y="617" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">Export CSV ↓</text>
</svg>